<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClearBGV — Login / Create Account</title>
<style>
:root{--blue:#1a56db;--navy:#0a1628;--green:#16a34a;--text:#1a2332;--muted:#64748b;--border:#e2e8f0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#f8fbff,#eef5ff);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);display:grid;place-items:center;padding:20px}
.card{width:min(460px,100%);background:#fff;border:1px solid var(--border);border-radius:20px;box-shadow:0 24px 70px rgba(15,23,42,.12);overflow:hidden}
.head{padding:28px 30px 18px;border-bottom:1px solid var(--border)}
.brand{font-size:26px;font-weight:800;color:var(--navy)} .brand span{color:var(--green)}
.sub{font-size:13px;color:var(--muted);margin-top:4px}
.body{padding:26px 30px 30px}
.tabs{display:flex;gap:8px;background:#f1f5f9;padding:5px;border-radius:10px;margin-bottom:20px}
.tabs a{flex:1;text-align:center;padding:10px;border-radius:7px;text-decoration:none;color:#475569;font-size:13px;font-weight:700}
.tabs a.active{background:#fff;color:var(--blue);box-shadow:0 2px 8px rgba(15,23,42,.08)}
form{display:none}.mode-login #login-form{display:block}.mode-signup #signup-form{display:block}
label{display:block;font-size:13px;font-weight:600;margin:0 0 7px}
input{width:100%;padding:12px 13px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;outline:none;margin-bottom:16px}
input:focus{border-color:#8fb1ff;box-shadow:0 0 0 3px #e8f0fe}
button{width:100%;padding:13px 16px;border:0;border-radius:9px;background:var(--blue);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.alt{text-align:center;margin-top:14px;font-size:12px;color:var(--muted)}
.alt a{color:var(--blue);font-weight:700}
.note{margin-top:18px;padding:12px;border-radius:9px;background:#f8fafc;color:#64748b;font-size:11px;line-height:1.55}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="head">
    <div class="brand">Clear<span>BGV</span></div>
    <div class="sub">Prepare. Verify. Proceed.</div>
  </div>
  <div class="body">
    <div class="tabs">
      <a href="?mode=login" id="loginTab">Log in</a>
      <a href="?mode=signup" id="signupTab">Create account</a>
    </div>

    <form id="login-form" method="post" action="/api/login">
      <label>Email address</label>
      <input name="email" type="email" autocomplete="email" required placeholder="you@example.com">
      <label>Password</label>
      <input name="password" type="password" autocomplete="current-password" required placeholder="Your password">
      <button type="submit">Log in to ClearBGV</button>
      <div class="alt"><a href="/?auth=reset">Forgot password?</a></div>
    </form>

    <form id="signup-form" method="post" action="/api/signup">
      <label>Full name</label>
      <input name="name" type="text" autocomplete="name" required placeholder="Your full name">
      <label>Email address</label>
      <input name="email" type="email" autocomplete="email" required placeholder="you@example.com">
      <label>Mobile number</label>
      <input name="phone" type="tel" autocomplete="tel" placeholder="+91 98765 43210">
      <label>Password</label>
      <input name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters">
      <button type="submit">Create my ClearBGV account</button>
    </form>

    <div class="note">Your ClearBGV account stores your profile and verification-readiness data in your private account space. Document storage remains private.</div>
    <div class="alt" style="margin-top:18px"><a href="/">← Back to ClearBGV</a></div>
  </div>
</div>
<script>
const params=new URLSearchParams(location.search);
const mode=params.get('mode')==='signup'?'signup':'login';
document.getElementById('card').classList.add('mode-'+mode);
document.getElementById(mode==='signup'?'signupTab':'loginTab').classList.add('active');
</script>
</body>
</html>

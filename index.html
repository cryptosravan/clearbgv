(async()=>{try{const ds=new DecompressionStream('gzip');const stream=new Blob([b64bytes(P)]).stream().pipeThrough(ds);const html=await new Response(stream).text();document.open();document.write(html);document.close();}catch(e){document.body.innerHTML='<pre style="font-family:monospace;white-space:pre-wrap;padding:24px">ClearBGV failed to load. '+String(e)+'</pre>';}})();
